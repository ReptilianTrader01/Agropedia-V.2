<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Bosque de Agropedia durante la noche</title>
  <desc id="desc">Bosque de pinos iluminado por la luna con un búho, un ciervo y pequeñas luces entre los árboles.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#071525"/><stop offset="1" stop-color="#173447"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173f38"/><stop offset="1" stop-color="#071b1c"/></linearGradient>
    <filter id="moonGlow"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="1600" height="620" fill="url(#sky)"/>
  <circle cx="1180" cy="125" r="105" fill="#cfe8e5" opacity=".22" filter="url(#moonGlow)"/>
  <circle cx="1180" cy="125" r="64" fill="#e8f4ee"/>
  <g fill="#fff" opacity=".8"><circle cx="130" cy="90" r="2"/><circle cx="260" cy="170" r="3"/><circle cx="470" cy="80" r="2"/><circle cx="690" cy="145" r="2"/><circle cx="910" cy="70" r="3"/><circle cx="1370" cy="80" r="2"/><circle cx="1510" cy="175" r="3"/></g>
  <path d="M0 390 L200 250 390 370 610 230 820 365 1030 245 1240 370 1450 230 1600 330 V620 H0Z" fill="#183849"/>
  <path d="M0 450 Q250 360 500 440 T1000 430 T1600 400 V620 H0Z" fill="url(#ground)"/>
  <g fill="#0b2827">
    <path d="M100 430 l75 -170 75 170 h-45 l45 80 h-150 l45 -80z"/>
    <path d="M290 440 l60 -145 60 145 h-35 l35 65 h-120 l35 -65z"/>
    <path d="M470 430 l80 -190 80 190 h-45 l50 85 h-170 l50 -85z"/>
    <path d="M700 440 l70 -175 70 175 h-40 l45 80 h-150 l45 -80z"/>
    <path d="M900 430 l85 -200 85 200 h-48 l50 90 h-174 l50 -90z"/>
    <path d="M1290 430 l80 -190 80 190 h-45 l48 85 h-166 l48 -85z"/>
    <path d="M1470 445 l55 -145 55 145 h-30 l30 65 h-110 l30 -65z"/>
  </g>
  <g opacity=".85">
    <circle cx="420" cy="510" r="5" fill="#d8f6a3"/><circle cx="560" cy="545" r="4" fill="#f7d66d"/><circle cx="850" cy="500" r="5" fill="#d8f6a3"/><circle cx="1030" cy="540" r="4" fill="#f7d66d"/><circle cx="1390" cy="515" r="5" fill="#d8f6a3"/>
  </g>
  <!-- Ciervo -->
  <g fill="#674a36" stroke="#382b24" stroke-width="4">
    <ellipse cx="1330" cy="490" rx="58" ry="30"/><ellipse cx="1380" cy="450" rx="25" ry="30"/><path d="M1360 425 q-18 -35 -35 -42 M1365 425 q5 -37 22 -48 M1390 425 q18 -32 38 -40" fill="none"/>
    <path d="M1300 510 l-12 65 M1340 512 l8 63 M1360 510 l20 60" fill="none"/>
